name: Build Skill Awakening

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.1.0'

      - name: Build plugin
        run: gradle build

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: Skill-Awakening-Paper-26.3
          path: build/libs/*.jar
