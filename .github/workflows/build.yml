
name: Build Skill Awakening

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          unzip -q Skill_Awakening_v8_9_Paper_26_3_GitHub_Ready.zip -d extracted

      - name: Find Gradle project
        id: project
        run: |
          BUILD_FILE=$(find extracted -name build.gradle.kts -print -quit)
          if [ -z "$BUILD_FILE" ]; then
            echo "Could not find build.gradle.kts"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$BUILD_FILE")
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.1.0'

      - name: Build plugin
        run: gradle -p "${{ steps.project.outputs.dir }}" build

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: Skill-Awakening-Paper-26.3
          path: extracted/**/build/libs/*.jar
